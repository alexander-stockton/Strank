<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strank</title>
    <link rel="icon" type="image/png" href="assets/icon.png" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <!--
      NW.js: require() loads modules in the Node context (no window #app).
      node-main lives under src/, so resolve ui as ./ui.js, then boot(window)
      with the real DOM window from this script tag.
    -->
    <script>
      try {
        require('./ui.js').boot(window);
      } catch (err) {
        var el = document.getElementById('app');
        if (el) {
          el.innerHTML =
            '<section class="error-view"><h1>Failed to load UI</h1><p>' +
            String((err && err.message) || err) +
            '</p><pre style="white-space:pre-wrap;font-size:12px">' +
            String((err && err.stack) || '') +
            '</pre></section>';
        }
        console.error(err);
      }
    </script>
  </body>
</html>
