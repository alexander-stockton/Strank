<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="PRO III badge">
  <defs>
    
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="55%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    
    <linearGradient id="starMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="45%" stop-color="#F6D860"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="innerStarMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="45%" stop-color="#F6D860"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="none"/>
  
  <g filter="url(#starGlow)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 128 128;360 128 128" dur="10s" repeatCount="indefinite"/>
      <polygon points="128.00,10.00 155.04,90.79 240.22,91.54 171.75,142.21 197.36,223.46 128.00,174.00 58.64,223.46 84.25,142.21 15.78,91.54 100.96,90.79" fill="url(#starMetal)" stroke="#92400E" stroke-width="2.5" opacity="0.98"/>
    </g>
  </g>
  
  <g filter="url(#shadow)">
    <circle cx="128" cy="128" r="96" fill="url(#g)" stroke="#F59E0B" stroke-width="7"/>
    <circle cx="128" cy="128" r="79" fill="none" stroke="#FBBF24" stroke-width="3.5" opacity="0.85"/>
  </g>
  
  <g>
    <polygon points="128.00,86.00 133.17,100.88 148.92,101.20 136.37,110.72 140.93,125.80 128.00,116.80 115.07,125.80 119.63,110.72 107.08,101.20 122.83,100.88" fill="url(#innerStarMetal)" stroke="#92400E" stroke-width="1.8"/>
    <polygon points="105.00,120.00 110.17,134.88 125.92,135.20 113.37,144.72 117.93,159.80 105.00,150.80 92.07,159.80 96.63,144.72 84.08,135.20 99.83,134.88" fill="url(#innerStarMetal)" stroke="#92400E" stroke-width="1.8"/>
    <polygon points="151.00,120.00 156.17,134.88 171.92,135.20 159.37,144.72 163.93,159.80 151.00,150.80 138.07,159.80 142.63,144.72 130.08,135.20 145.83,134.88" fill="url(#innerStarMetal)" stroke="#92400E" stroke-width="1.8"/>
  </g>
</svg>
