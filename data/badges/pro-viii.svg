<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="PRO VIII badge">
  <defs>
    
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2244">
        <animate attributeName="stop-color" values="#ff2244;#22ff66;#4488ff;#ff2244" dur="2.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1F2937">
        <animate attributeName="stop-color" values="#2a1020;#102a18;#101828;#2a1020" dur="2.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#4488ff">
        <animate attributeName="stop-color" values="#4488ff;#ff2244;#22ff66;#4488ff" dur="2.8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="rainbowGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="starMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="45%" stop-color="#F6D860"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="innerStarMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="45%" stop-color="#F6D860"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="none"/>
  
  <g filter="url(#starGlow)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 128 128;360 128 128" dur="10s" repeatCount="indefinite"/>
      <polygon points="128.00,10.00 155.04,90.79 240.22,91.54 171.75,142.21 197.36,223.46 128.00,174.00 58.64,223.46 84.25,142.21 15.78,91.54 100.96,90.79" fill="url(#starMetal)" stroke="#92400E" stroke-width="2.5" opacity="0.98"/>
    </g>
  </g>
  <circle cx="128" cy="128" r="120" fill="none" stroke="#ff0040" stroke-width="10" opacity="0.55" filter="url(#rainbowGlow)">
    <animate attributeName="stroke" values="#ff0040;#ff8c00;#ffee00;#00c853;#00b0ff;#7c4dff;#ff0040" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="128" cy="128" r="114" fill="none" stroke="#00b0ff" stroke-width="4" opacity="0.7">
    <animate attributeName="stroke" values="#00b0ff;#7c4dff;#ff0040;#ff8c00;#ffee00;#00c853;#00b0ff" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  
  <g filter="url(#shadow)">
    <circle cx="128" cy="128" r="96" fill="url(#g)" stroke="#111827" stroke-width="7"/>
    <circle cx="128" cy="128" r="78" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.55">
      <animate attributeName="stroke" values="#ff6680;#66ff99;#88bbff;#ff6680" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g>
    <polygon points="128.00,68.00 135.52,89.64 158.43,90.11 140.17,103.96 146.81,125.89 128.00,112.80 109.19,125.89 115.83,103.96 97.57,90.11 120.48,89.64" fill="url(#innerStarMetal)" stroke="#92400E" stroke-width="2"/>
    <polygon points="100.00,144.00 103.29,153.47 113.31,153.67 105.33,159.73 108.23,169.33 100.00,163.60 91.77,169.33 94.67,159.73 86.69,153.67 96.71,153.47" fill="url(#innerStarMetal)" stroke="#92400E" stroke-width="1.4"/>
    <polygon points="128.00,144.00 131.29,153.47 141.31,153.67 133.33,159.73 136.23,169.33 128.00,163.60 119.77,169.33 122.67,159.73 114.69,153.67 124.71,153.47" fill="url(#innerStarMetal)" stroke="#92400E" stroke-width="1.4"/>
    <polygon points="156.00,144.00 159.29,153.47 169.31,153.67 161.33,159.73 164.23,169.33 156.00,163.60 147.77,169.33 150.67,159.73 142.69,153.67 152.71,153.47" fill="url(#innerStarMetal)" stroke="#92400E" stroke-width="1.4"/>
  </g>
</svg>
