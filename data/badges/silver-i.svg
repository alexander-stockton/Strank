<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="SILVER I badge">
  <defs>
    
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#5A6570"/>
    </linearGradient>
    
    <linearGradient id="starMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E8F0F8"/>
      <stop offset="65%" stop-color="#7A8FA3"/>
      <stop offset="100%" stop-color="#1A2330"/>
    </linearGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="innerStarMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E8F0F8"/>
      <stop offset="65%" stop-color="#7A8FA3"/>
      <stop offset="100%" stop-color="#1A2330"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="none"/>
  
  <g filter="url(#starGlow)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 128 128;360 128 128" dur="10s" repeatCount="indefinite"/>
      <polygon points="128.00,10.00 155.04,90.79 240.22,91.54 171.75,142.21 197.36,223.46 128.00,174.00 58.64,223.46 84.25,142.21 15.78,91.54 100.96,90.79" fill="url(#starMetal)" stroke="#0F1720" stroke-width="2.5" opacity="0.98"/>
    </g>
  </g>
  
  <g filter="url(#shadow)">
    <circle cx="128" cy="128" r="96" fill="url(#g)" stroke="#4B5563" stroke-width="7"/>
    <circle cx="128" cy="128" r="79" fill="none" stroke="#FFFFFF" stroke-width="3.5" opacity="0.85"/>
  </g>
  
  <g>
    <polygon points="128.00,92.00 136.46,116.35 162.24,116.88 141.70,132.45 149.16,157.12 128.00,142.40 106.84,157.12 114.30,132.45 93.76,116.88 119.54,116.35" fill="url(#innerStarMetal)" stroke="#0F1720" stroke-width="2"/>
  </g>
</svg>
