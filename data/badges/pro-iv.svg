<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="PRO IV badge">
  <defs>
    
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="55%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    
    <linearGradient id="starMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="45%" stop-color="#F6D860"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="innerStarMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="45%" stop-color="#F6D860"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="none"/>
  
  <g filter="url(#starGlow)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 128 128;360 128 128" dur="10s" repeatCount="indefinite"/>
      <polygon points="128.00,10.00 155.04,90.79 240.22,91.54 171.75,142.21 197.36,223.46 128.00,174.00 58.64,223.46 84.25,142.21 15.78,91.54 100.96,90.79" fill="url(#starMetal)" stroke="#92400E" stroke-width="2.5" opacity="0.98"/>
    </g>
  </g>
  
  <g filter="url(#shadow)">
    <circle cx="128" cy="128" r="96" fill="url(#g)" stroke="#F59E0B" stroke-width="7"/>
    <circle cx="128" cy="128" r="79" fill="none" stroke="#FBBF24" stroke-width="3.5" opacity="0.85"/>
  </g>
  
  <g>
    <polygon points="102.00,82.00 106.70,95.53 121.02,95.82 109.61,104.47 113.76,118.18 102.00,110.00 90.24,118.18 94.39,104.47 82.98,95.82 97.30,95.53" fill="url(#innerStarMetal)" stroke="#92400E" stroke-width="1.8"/>
    <polygon points="154.00,82.00 158.70,95.53 173.02,95.82 161.61,104.47 165.76,118.18 154.00,110.00 142.24,118.18 146.39,104.47 134.98,95.82 149.30,95.53" fill="url(#innerStarMetal)" stroke="#92400E" stroke-width="1.8"/>
    <polygon points="102.00,134.00 106.70,147.53 121.02,147.82 109.61,156.47 113.76,170.18 102.00,162.00 90.24,170.18 94.39,156.47 82.98,147.82 97.30,147.53" fill="url(#innerStarMetal)" stroke="#92400E" stroke-width="1.8"/>
    <polygon points="154.00,134.00 158.70,147.53 173.02,147.82 161.61,156.47 165.76,170.18 154.00,162.00 142.24,170.18 146.39,156.47 134.98,147.82 149.30,147.53" fill="url(#innerStarMetal)" stroke="#92400E" stroke-width="1.8"/>
  </g>
</svg>
