<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="GOLD II badge">
  <defs>
    
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    
    <linearGradient id="starMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFF0"/>
      <stop offset="30%" stop-color="#FFE566"/>
      <stop offset="65%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#3D2A00"/>
    </linearGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="innerStarMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFF0"/>
      <stop offset="30%" stop-color="#FFE566"/>
      <stop offset="65%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#3D2A00"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="none"/>
  
  <g filter="url(#starGlow)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 128 128;360 128 128" dur="10s" repeatCount="indefinite"/>
      <polygon points="128.00,10.00 155.04,90.79 240.22,91.54 171.75,142.21 197.36,223.46 128.00,174.00 58.64,223.46 84.25,142.21 15.78,91.54 100.96,90.79" fill="url(#starMetal)" stroke="#2A1C00" stroke-width="2.5" opacity="0.98"/>
    </g>
  </g>
  
  <g filter="url(#shadow)">
    <circle cx="128" cy="128" r="96" fill="url(#g)" stroke="#6B5010" stroke-width="7"/>
    <circle cx="128" cy="128" r="79" fill="none" stroke="#FFF8DC" stroke-width="3.5" opacity="0.85"/>
  </g>
  
  <g>
    <polygon points="94.00,102.00 100.11,119.59 118.73,119.97 103.89,131.21 109.28,149.03 94.00,138.40 78.72,149.03 84.11,131.21 69.27,119.97 87.89,119.59" fill="url(#innerStarMetal)" stroke="#2A1C00" stroke-width="1.8"/>
    <polygon points="162.00,102.00 168.11,119.59 186.73,119.97 171.89,131.21 177.28,149.03 162.00,138.40 146.72,149.03 152.11,131.21 137.27,119.97 155.89,119.59" fill="url(#innerStarMetal)" stroke="#2A1C00" stroke-width="1.8"/>
  </g>
</svg>
